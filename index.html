<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rig Check</title>
<meta name="theme-color" content="#13203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rig Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: walk up to the truck - pick it, see it from above, open a door, open a bag inside it */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#13203A; --muted:#5A6679; --line:#D2D8E0;
  --accent:#1D58A6; --accent-ink:#FFFFFF;
  --ok:#1C8648; --warn:#B86E00; --crit:#C42A1F; --idle:#C7CFD9; --prog:#1D58A6;
  --truck:#F8FAFC; --truck-line:#5A6679; --stripe:#C42A1F; --glass:#BFD3EA; --art-bg:#DCE3EC; --tire:#262C36;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D141E; --panel:#162030; --ink:#E5EBF3; --muted:#91A0B4; --line:#283447;
  --accent:#5C95E1; --accent-ink:#0D141E;
  --ok:#3DBB72; --warn:#EFA22B; --crit:#F2594C; --idle:#334051; --prog:#5C95E1;
  --truck:#1B2737; --truck-line:#8C9AAE; --stripe:#E0483C; --glass:#33506F; --art-bg:#131C29; --tire:#05080C; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted)}
.st-idle{--s:var(--idle)} .st-ok{--s:var(--ok)} .st-short{--s:var(--warn)} .st-crit{--s:var(--crit)} .st-prog{--s:var(--prog)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row.between{justify-content:space-between;align-items:center}

/* bars */
.bar{display:flex;align-items:center;gap:10px;padding-block:14px 12px}
.bar h1{font-size:32px;flex:1;min-width:0}
.bar.sub{display:grid;gap:8px}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar.sub h1{font-size:30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hcode{font-size:22px;border:2.5px solid var(--ink);border-radius:8px;padding:0 8px;line-height:1.25}
.crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.crumbs button{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:700;font-size:14px}
.mark{width:40px;height:40px;flex:none;color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 16px 0 10px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back svg{width:22px;height:22px;flex:none}
.netnote{font-size:13px;color:var(--muted);text-align:right}
.netnote.off{color:var(--warn);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;text-align:center}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;white-space:nowrap}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.inp,.field input,.field select{min-height:56px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px 14px;font-size:18px;width:100%;min-width:0}
.sinp{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:4px 10px;min-width:0;width:100%;font-size:17px}

/* home */
.trucks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;text-align:left;padding:0;border-radius:18px;overflow:hidden;background:var(--panel);border:2px solid var(--line)}
.tcard .pic{aspect-ratio:16/9;width:100%;background:var(--art-bg);overflow:hidden}
.tcard .pic img,.tcard .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.tcard .meta{padding:14px 16px 16px;display:grid;gap:6px}
.tcard h2{font-size:30px}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--s)}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--s);flex:none}
.status.st-idle{color:var(--muted)} .status.st-idle .dot{background:var(--warn)}
.install{display:flex;gap:12px;align-items:center;border-left:6px solid var(--accent);margin-bottom:14px}
.install svg{width:40px;height:40px;flex:none;color:var(--accent)}

/* truck */
.checkcard{display:grid;gap:12px;border-left:6px solid var(--accent)}
.progress{height:14px;border-radius:7px;background:var(--idle);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .p{background:var(--ok)} .progress .f{background:var(--crit)}
.bignum{font-family:var(--f-display);font-weight:700;font-size:30px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0}
.tabs button{min-height:50px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:16px;color:var(--muted);position:relative}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--crit);color:#fff;font-size:12px;margin-left:6px;vertical-align:2px}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:58px;border-radius:29px;border:2px solid var(--line);background:var(--panel);padding:0 52px;font-size:18px}
.search input:focus{border-color:var(--accent);outline:none}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:22px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.diag{position:sticky;top:12px}
@media (max-width:820px){.diag{position:static}}
svg.truck{width:100%;max-width:300px;display:block;margin:0 auto}
svg.truck .slot{cursor:pointer}
svg.truck .slot rect{stroke:var(--truck-line);stroke-width:1.5;fill:color-mix(in srgb,var(--s) 26%,var(--truck))}
svg.truck .slot.st-idle rect{fill:var(--truck)}
svg.truck .slot:hover rect{stroke:var(--accent);stroke-width:3}
svg.truck text{font-family:var(--f-display);font-weight:700;fill:var(--ink);pointer-events:none}
.emptyslot{fill:none;stroke:var(--truck-line);stroke-dasharray:4 4;opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ldot{width:12px;height:12px;border-radius:3px;background:var(--s);display:inline-block}
.grouph{display:flex;justify-content:space-between;align-items:end;margin:18px 0 8px}
.grouph:first-child{margin-top:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
@media (max-width:460px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ccard{display:flex;flex-direction:column;padding:0;text-align:left;border-radius:14px;overflow:hidden;background:var(--panel);border:3px solid var(--s)}
.ccard.st-idle{border-color:var(--line)}
.ccard .ph{aspect-ratio:4/3;width:100%;background:var(--bg);position:relative;overflow:hidden;display:grid;place-items:center}
.ccard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;justify-items:center;gap:4px;color:var(--muted)}
.noimg svg{width:40px;height:40px}
.noimg b{font-family:var(--f-display);font-size:30px;color:var(--ink);line-height:1}
.cbadge{position:absolute;left:8px;top:8px;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--panel);color:var(--ink);border-radius:8px;padding:1px 9px;border:2px solid var(--s)}
.st-idle .cbadge{border-color:var(--line)}
.ccard .cm{padding:10px 12px 12px;display:grid;gap:2px}
.ccard .cm b{font-size:17px;line-height:1.2}
.ccard .cm small{color:var(--muted);font-size:14px}
.ccard .cm small.alert{color:var(--s);font-weight:700}
.addcard{border:2.5px dashed var(--line);background:transparent;border-radius:14px;min-height:120px;display:grid;place-items:center;font-weight:700;color:var(--accent);font-size:17px;padding:12px}
.results{display:grid;gap:8px}
.res{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;min-height:72px}
.rt{width:60px;height:56px;border-radius:10px;overflow:hidden;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.rt img{width:100%;height:100%;object-fit:cover}
.rt svg{width:28px;height:28px}
.res b{display:block;font-size:18px}
.res mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}
.res small{color:var(--muted)}
.chev{font-size:26px;color:var(--muted)}

/* node page */
.nodebody{display:grid;gap:14px;max-width:780px;margin:0 auto}
.pv{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.pv img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.pv.editing{touch-action:none;cursor:crosshair;outline:3px dashed var(--accent);outline-offset:2px}
.spot{position:absolute;padding:0;border:3px solid var(--s);border-radius:8px;background:color-mix(in srgb,var(--s) 18%,transparent);box-shadow:0 0 0 1.5px rgba(0,0,0,.55);display:block}
.spot.st-idle{--s:#FFFFFF;background:rgba(255,255,255,.1)}
.spot span{position:absolute;left:3px;top:3px;font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.15;background:var(--s);color:#0D141E;border-radius:5px;padding:1px 6px;max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot.st-crit span,.spot.st-ok span,.spot.st-prog span{color:#fff}
.spot.unlinked{border-style:dashed;--s:#FFFFFF}
.spot.sel{outline:4px solid var(--accent);outline-offset:2px;z-index:2}
#draw{position:absolute;border:3px dashed #fff;background:rgba(92,149,225,.3);box-shadow:0 0 0 1.5px #000;pointer-events:none;border-radius:6px}
.phbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hint{font-size:15px;color:var(--muted);margin:0}
.nophoto{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.nophoto>svg{width:64px;height:64px;color:var(--muted)}
.list{display:grid;gap:8px}
.kid{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-left:8px solid var(--s);border-radius:14px;padding:8px 12px 8px 8px;min-height:76px}
.kid.st-idle{border-left-color:var(--line)}
.kid b{display:block;font-size:18px;line-height:1.2}
.kid small{color:var(--muted);font-size:14px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px 12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-left:8px solid var(--s);border-radius:14px;padding:10px 12px 10px 8px}
.item.st-idle{border-left-color:var(--line)}
.item .rt{width:52px;height:52px}
.item b{display:block;font-size:18px;line-height:1.25}
.item small{color:var(--muted);font-size:14px}
.item small .c{color:var(--crit);font-weight:700}
.item .ctl{grid-column:1 / -1;display:grid;gap:8px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.tri button{min-height:54px;border:0;background:var(--panel);font-weight:700;font-size:16px;border-left:1.5px solid var(--line)}
.tri button:first-child{border-left:0}
.tri .pass[aria-pressed="true"]{background:var(--ok);color:#fff}
.tri .fail[aria-pressed="true"]{background:var(--crit);color:#fff}
.tri .none[aria-pressed="true"]{background:var(--idle);color:var(--ink)}
.have{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.step button{width:52px;height:50px;border:0;background:transparent;font-size:26px;font-weight:700}
.step output{min-width:40px;text-align:center;font-family:var(--f-mono);font-size:20px}
.item.flash,.kid.flash{animation:flash 1.6s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.navfoot{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:6px}
.navfoot .btn{min-height:58px}
.navfoot .next{justify-content:space-between}
.navfoot .next span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow{display:grid;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.erow .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.erow .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.erow .opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.erow .opts .sinp{width:auto}
.crit-l{display:flex;align-items:center;gap:6px;font-size:15px}
.crit-l input{width:22px;height:22px}
.iconbtn{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:19px;flex:none}
.iconbtn:disabled{opacity:.35}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kindpick{display:flex;gap:6px;flex-wrap:wrap}
.kindpick button{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.kindpick button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.spotpanel{border-left:6px solid var(--accent)}

/* move */
.dest{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700}
.dest:disabled{opacity:.4}
.dest small{font-weight:400;color:var(--muted)}

/* needs / history */
.need{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-left:8px solid var(--s);border-radius:14px;padding:8px 12px 8px 8px}
.need .rt{width:52px;height:52px}
.need b{display:block;font-size:18px}
.need small{color:var(--muted)}
@media (max-width:460px){.need{grid-template-columns:52px minmax(0,1fr)}.need .btn{grid-column:1 / -1}}
.pill{display:inline-flex;align-items:center;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--s) 16%,transparent);color:var(--s);white-space:nowrap}
.loglist{display:grid;gap:4px;font-size:15px}
.loglist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
details.hist{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--s);border-radius:14px}
details.hist summary{list-style:none;cursor:pointer;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
details.hist summary::-webkit-details-marker{display:none}
details.hist .body{padding:0 14px 14px;display:grid;gap:10px;font-size:16px}
details.hist ul{margin:0;padding-left:20px}
.summary{display:grid;gap:8px;border-left:6px solid var(--s)}
.summary ul{margin:0;padding-left:20px}
.banner{border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:15px}
.trow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.trow .tp{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--art-bg)}
.trow .tp img,.trow .tp svg{width:100%;height:100%;object-fit:cover;display:block}
.trow .tf{display:grid;gap:8px}
.trow .ta{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.loading{text-align:center;padding:60px 10px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div class="wrap" id="app"><div class="loading">Loading trucks…</div></div>
<input type="file" id="photoin" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>
<script>
const API_URL='https:'+'/'+'/script.google.com/macros/s/AKfycbxf3jjfUjNZJKJR47WteKyhSbAnGsWjP9fyCUMucq4T6ILNMpx5PrL71-5_7CKm2jeF/exec';
const SCHEMA=3;

/* ---------- back end ---------- */
const GAS=(typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;
const LOCAL=!GAS&&location.protocol==='file:';
const Local={
  key:'rc3-local',
  load(){ return ls.get(this.key,null)||{v:'1',docs:{},files:{}}; },
  save(d){ ls.set(this.key,d); },
  bump(d){ d.v=String(Date.now())+uid(); this.save(d); return {v:d.v}; },
  getAll(since,ex){ const d=this.load(); if(since&&since===d.v) return {same:true,v:d.v}; const docs={}; Object.keys(d.docs).forEach(p=>{ if(!(ex||[]).some(x=>p.startsWith(x))) docs[p]=d.docs[p]; }); return {same:false,v:d.v,docs}; },
  getMany(paths){ const d=this.load(); const o={}; paths.forEach(p=>{ if(p in d.docs) o[p]=d.docs[p]; }); return o; },
  batch(ops){ const d=this.load(); JSON.parse(ops).forEach(o=>{ if(o.op==='delete') delete d.docs[o.path]; else d.docs[o.path]=o.json; }); return this.bump(d); },
  uploadPhoto(b64){ const d=this.load(); const id='L'+uid(); d.files[id]=b64; this.save(d); return id; },
  getPhoto(id){ return this.load().files[id]||''; },
  deletePhoto(id){ const d=this.load(); delete d.files[id]; this.save(d); return true; }
};
function call(fn,...args){
  if(GAS) return new Promise((res,rej)=>{ GAS.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
  if(LOCAL) return new Promise((res,rej)=>setTimeout(()=>{ try{ res(Local[fn](...args)); }catch(e){ rej(e); } },20));
  return fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args}),headers:{'Content-Type':'text/plain;charset=utf-8'},credentials:'omit',redirect:'follow',cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(j=>{ if(j.error) throw new Error(j.error); return j.result; });
}

/* ---------- tiny IndexedDB for photos ---------- */
const IDB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open('rigcheck',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  get(k){ return this.open().then(db=>new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); })).catch(()=>undefined); },
  set(k,v){ return this.open().then(db=>new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); })).catch(()=>false); }
};

/* ---------- store with offline queue ---------- */
let D=ls.get('rc3-docs',{}); let lastV=ls.get('rc3-v',null);
let Q=ls.get('rc3-queue',{});
let loaded=Object.keys(D).length>0, online=true, pulling=false, flushing=false, flushT=null;
function persist(path,obj){
  if(obj===null) delete D[path]; else D[path]=obj;
  Q[path]= obj===null?null:JSON.stringify(obj);
  ls.set('rc3-queue',Q); ls.set('rc3-docs',D);
  clearTimeout(flushT); flushT=setTimeout(flush,400);
}
function persistMany(list){ list.forEach(([p,o])=>{ if(o===null) delete D[p]; else D[p]=o; Q[p]= o===null?null:JSON.stringify(o); }); ls.set('rc3-queue',Q); ls.set('rc3-docs',D); clearTimeout(flushT); flushT=setTimeout(flush,200); }
async function flush(){
  if(flushing) return; const keys=Object.keys(Q); if(!keys.length) return;
  flushing=true; const sent={}; keys.forEach(k=>sent[k]=Q[k]);
  const ops=keys.map(k=>Q[k]===null?{op:'delete',path:k}:{op:'set',path:k,json:Q[k]});
  try{
    for(let i=0;i<ops.length;i+=60) await call('batch',JSON.stringify(ops.slice(i,i+60)));
    keys.forEach(k=>{ if(Q[k]===sent[k]) delete Q[k]; }); ls.set('rc3-queue',Q); if(online&&!Object.keys(Q).length){ const el=document.querySelector('.netnote'); if(el) el.textContent=''; } setOnline(true);
  }catch(e){ setOnline(false); if(/too large/i.test(String(e&&e.message))){ toast('A record was too large to save.'); keys.forEach(k=>{ if(Q[k]===sent[k]) delete Q[k]; }); ls.set('rc3-queue',Q); } else setTimeout(flush,10000); }
  flushing=false; if(Object.keys(Q).length&&online) setTimeout(flush,300);
}
function setOnline(v){ if(online!==v){ online=v; render(); } }
async function pull(){
  if(pulling) return; pulling=true;
  try{
    if(Object.keys(Q).length) await flush();
    const r=await call('getAll',lastV,['thumbs/']);
    setOnline(true);
    if(!r.same){
      lastV=r.v; const nd={};
      for(const [p,j] of Object.entries(r.docs||{})){ try{ nd[p]=JSON.parse(j); }catch(e){} }
      Object.keys(Q).forEach(p=>{ if(Q[p]===null) delete nd[p]; else nd[p]=JSON.parse(Q[p]); });
      D=nd; ls.set('rc3-docs',D); ls.set('rc3-v',lastV);
      const first=!loaded; loaded=true;
      if(!D['meta/schema']||D['meta/schema'].v<SCHEMA) ensureSchema();
      if(first||!drag) render();
    }
  }catch(e){ setOnline(false); if(!loaded){ document.getElementById('app').innerHTML='<div class="loading">Can\'t reach the rig check sheet. Check your signal. Retrying…</div>'; } }
  pulling=false;
}

const truck=tid=>{ const t=D['trucks/'+tid]; return t?Object.assign({},t,{id:tid}):null; };
const node=id=>{ const n=D['nodes/'+id]; return n?Object.assign({},n,{id}):null; };
const allNodes=()=>list('nodes/');
const kidsOf=id=>allNodes().filter(n=>n.parent===id).sort((a,b)=>(a.kind==='item')-(b.kind==='item')||(a.order||0)-(b.order||0));

function ancestors(id){ const out=[]; let n=node(id); let g=0; while(n&&n.parent&&g++<30){ n=node(n.parent); if(n) out.unshift(n); } return out; }
function descendants(id){ const out=[]; const walk=p=>allNodes().filter(n=>n.parent===p).forEach(n=>{ out.push(n); walk(n.id); }); walk(id); return out; }
const itemsUnder=id=>descendants(id).filter(n=>n.kind==='item');

/* ---------- status ---------- */
const resOf=(cur,id)=>cur&&cur.res?cur.res[id]:undefined;
function itemSt(it,cur){ const r=resOf(cur,it.id); if(r==='fail') return it.critical?'crit':'short'; if(r==='pass') return 'ok'; return 'idle'; }
function stats(items,cur){ let pass=0,fail=0,crit=0; items.forEach(it=>{ const r=resOf(cur,it.id); if(r==='pass') pass++; else if(r==='fail'){ fail++; if(it.critical) crit++; } }); const total=items.length;
  const st= !cur||!total?'idle': crit?'crit': fail?'short': pass===total?'ok': pass?'prog':'idle'; return {total,pass,fail,crit,st,left:total-pass-fail}; }
const nodeStats=(n,cur)=>stats(n.kind==='item'?[n]:itemsUnder(n.id),cur);
function needOf(it,cur){ if(it.type==='count'){ const have=cur&&cur.have&&cur.have[it.id]!=null?cur.have[it.id]:0; return Math.max(1,(+it.par||1)-have); } return 1; }
function truckState(tid){
  const cur=curOf(tid); if(cur){ const s=stats(truckItems(tid),cur); return {st:'prog',text:'Check in progress · '+(s.pass+s.fail)+' of '+s.total+(cur.crew?' · '+cur.crew:'')}; }
  const last=checksOf(tid)[0];
  if(last&&dayKey(new Date(last.ts))===dayKey()){ const open=(last.failed||[]).filter(f=>!f.restocked).length; return {st:open?'short':'ok',text:'Checked today '+fmtT(last.ts)+(last.crew?' · '+last.crew:'')+(open?' · '+open+' needed':'')}; }
  return {st:'idle',text:last?'Not checked today · last '+fmtDT(last.ts):'Not checked yet'};
}

/* ---------- first run / reset to new layout ---------- */
function defaultComp(tid,loc){
  const id=tid+'_'+loc; const ops=[['nodes/'+id,{truck:tid,parent:'',kind:'comp',name:loc==='hood'?'Vehicle walk-around':'Cab',code:loc==='hood'?'VEH':'CAB',loc,order:1}]];
  return {id,ops};
}
function ensureSchema(){
  const ops=[]; const del=p=>ops.push([p,null]);
  let T=trucks();
  if(!T.length){ T=['Medic 1','Medic 2','Medic 3'].map((name,i)=>{ const id='m'+(i+1); ops.push(['trucks/'+id,{name,order:i+1}]); return {id,name}; }); }
  const keep={};
  Object.keys(D).forEach(p=>{
    const d=D[p];
    if(p.startsWith('compartments/')){
      const side=d.side||({hood:'hood',cab:'cab'})[d.slot]||(d.code==='VEH'?'hood':d.code==='CAB'?'cab':null);
      if(d.truck&&(side==='hood'||side==='cab')&&!keep[d.truck+side]){
        keep[d.truck+side]=1; const id=d.truck+'_'+side;
        ops.push(['nodes/'+id,{truck:d.truck,parent:'',kind:'comp',name:d.name||(side==='hood'?'Vehicle walk-around':'Cab'),code:d.code||(side==='hood'?'VEH':'CAB'),loc:side,order:1}]);
        (d.items||[]).forEach((it,i)=>ops.push(['nodes/'+id+'_i'+i,{truck:d.truck,parent:id,kind:'item',name:it.name,type:it.type==='check'?'check':'count',par:+it.par||0,critical:!!it.critical,order:i+1}]));
      }
      del(p);
    } else if(/^(views|current|checks|usage|rig)[/]/.test(p)){ if(d&&d.file) call('deletePhoto',d.file).catch(()=>{}); del(p); }
    else if(p.startsWith('photos/')&&!String(d.comp||'').startsWith('truck:')){ if(d.file) call('deletePhoto',d.file).catch(()=>{}); del(p); }
  });
  T.forEach(t=>['hood','cab'].forEach(loc=>{ if(!keep[t.id+loc]&&!D['nodes/'+t.id+'_'+loc]){ const id=t.id+'_'+loc; ops.push(['nodes/'+id,{truck:t.id,parent:'',kind:'comp',name:loc==='hood'?'Vehicle walk-around':'Cab',code:loc==='hood'?'VEH':'CAB',loc,order:1}]); (DEFAULTS[loc==='hood'?'veh':'cab']||[]).forEach((it,i)=>ops.push(['nodes/'+id+'_i'+i,Object.assign({truck:t.id,parent:id,kind:'item',order:i+1},it)])); } }));
  ops.push(['meta/schema',{v:SCHEMA,at:Date.now()}]);
  persistMany(ops);
}

/* ---------- photos ---------- */
const TH={}, THQ=new Set(); let thT=null; const FULL={}, FULLQ={};
function thumbOf(file){
  if(!file) return '';
  if(TH[file]) return TH[file];
  if(!THQ.has(file)){ THQ.add(file); IDB.get('th:'+file).then(v=>{ if(v){ TH[file]=v; render(); } else { clearTimeout(thT); thT=setTimeout(fetchThumbs,60); } }); }
  return '';
}
async function fetchThumbs(){
  const want=[...THQ].filter(f=>!TH[f]); if(!want.length) return;
  try{ const r=await call('getMany',want.map(f=>'thumbs/'+f)); Object.entries(r||{}).forEach(([p,j])=>{ try{ const f=p.slice(7); TH[f]=JSON.parse(j).d; IDB.set('th:'+f,TH[f]); }catch(e){} }); render(); }
  catch(e){ want.forEach(f=>THQ.delete(f)); }
}
function fullOf(file){
  if(!file) return '';
  if(FULL[file]) return FULL[file];
  if(!FULLQ[file]){ FULLQ[file]=1;
    IDB.get('full:'+file).then(async b=>{
      if(!b){ try{ const b64=await call('getPhoto',file); if(!b64) return; const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); b=new Blob([u],{type:'image/jpeg'}); IDB.set('full:'+file,b); }catch(e){ FULLQ[file]=0; return; } }
      FULL[file]=URL.createObjectURL(b); render();
    });
  }
  return thumbOf(file);
}
const legacyThumb=p=>p.thumb||thumbOf(p.file);
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('decode')); im.src=u; }); }
function shrink(im,max){ const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(im.naturalWidth*s)); cv.height=Math.max(1,Math.round(im.naturalHeight*s)); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); return cv; }
async function savePhoto(f){
  const im=await loadImg(f);
  const fullCv=shrink(im,1600); const fullUrl=fullCv.toDataURL('image/jpeg',.8);
  let thumb=shrink(im,320).toDataURL('image/jpeg',.62); if(thumb.length>30000) thumb=shrink(im,240).toDataURL('image/jpeg',.55);
  const file=await call('uploadPhoto',fullUrl.split(',')[1],'rig');
  TH[file]=thumb; IDB.set('th:'+file,thumb);
  const blob=await (await fetch(fullUrl)).blob(); IDB.set('full:'+file,blob); FULL[file]=URL.createObjectURL(blob);
  persist('thumbs/'+file,{d:thumb});
  return {file,w:im.naturalWidth,h:im.naturalHeight};
}
function dropPhoto(file){ if(!file) return; persist('thumbs/'+file,null); call('deletePhoto',file).catch(()=>{}); }

/* ---------- top-down diagram, built from compartment locations ---------- */
function split(x,y,w,h,n,dir,gap){ gap=gap||6; const out=[]; for(let i=0;i<n;i++){ if(dir==='v'){ const hh=(h-gap*(n-1))/n; out.push({x,y:y+i*(hh+gap),w,h:hh}); } else { const ww=(w-gap*(n-1))/n; out.push({x:x+i*(ww+gap),y,w:ww,h}); } } return out; }
function diagram(tid){
  const by={}; topComps(tid).forEach(c=>(by[c.loc]=by[c.loc]||[]).push(c));
  const g=[]; const put=(L,boxes)=>L.forEach((c,i)=>g.push(Object.assign({c},boxes[i])));
  const area={hood:[96,14,128,48,'h'],cab:[74,68,172,80,'h'],driver:[12,166,40,348,'v'],curb:[268,166,40,348,'v'],rear:[56,540,208,40,'h'],interior:[66,168,188,338,'grid']};
  const empty=[];
  Object.entries(area).forEach(([loc,[x,y,w,h,dir]])=>{ const L=by[loc]; if(!L){ empty.push('<rect class="emptyslot" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6"/>'); return; }
    if(dir==='grid'){ const n=L.length,cols=n>=2?2:1,rows=Math.ceil(n/cols),rh=(h-6*(rows-1))/rows; L.forEach((c,i)=>{ const r=Math.floor(i/cols),col=i%cols,lastOdd=cols===2&&i===n-1&&n%2===1,ww=(lastOdd||cols===1)?w:(w-6)/2; g.push({c,x:x+(lastOdd?0:col*((w-6)/2+6)),y:y+r*(rh+6),w:ww,h:rh}); }); }
    else put(L,split(x,y,w,h,L.length,dir)); });
  const cur=curOf(tid);
  const slots=g.map(({c,x,y,w,h})=>{ const s=nodeStats(c,cur).st; const label=c.code||c.name.slice(0,4); const fs=w<50?14:17;
    return '<g class="slot st-'+s+'" data-act="open" data-n="'+esc(c.id)+'" role="button" aria-label="'+esc(c.name)+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(c.loc==='hood'?14:6)+'"/><text x="'+(x+w/2)+'" y="'+(y+h/2+6)+'" text-anchor="middle" font-size="'+fs+'">'+esc(label)+'</text>'+(s!=='idle'?'<circle cx="'+(x+w-9)+'" cy="'+(y+9)+'" r="4.5" fill="var(--s)"/>':'')+'</g>'; }).join('');
  return '<svg class="truck" viewBox="0 0 320 588" role="group" aria-label="Truck from above">'+

  const empty= !kids.length&&!editing? '<div class="card empty"><b>Nothing in here yet.</b><span class="muted">Tap Edit to add bags, boxes and items.</span></div>':'';
  let nav='';
  if(!editing&&n.kind==='comp'){ const C=topComps(n.truck); const i=C.findIndex(c=>c.id===n.id); const prev=C[i-1], next=C[i+1];
    nav='<div class="navfoot">'+(prev?'<button class="btn" data-act="open" data-n="'+esc(prev.id)+'">‹ '+esc(prev.code||prev.name)+'</button>':'<button class="btn" data-act="truck" data-t="'+esc(n.truck)+'">‹ Truck</button>')+(next?'<button class="btn primary next" data-act="open" data-n="'+esc(next.id)+'"><span>Next: '+esc((next.code?next.code+' ':'')+next.name)+'</span><span>›</span></button>':'<button class="btn primary" data-act="truck" data-t="'+esc(n.truck)+'">Back to truck</button>')+'</div>'; }
  if(n.kind==='item') return topbar(n.name,backLabel,'<button class="btn small" data-act="edit">'+(editing?'Done':'Edit')+'</button>','',crumbsFor(n))+'<div class="nodebody">'+photoPanel(n)+'<div class="list">'+itemRow(n,cur,editing)+'</div></div>';
  return topbar(n.name,backLabel,'<button class="btn small" data-act="edit">'+(editing?'Done':'Edit')+'</button>',n.code,crumbsFor(n))+
    '<div class="nodebody">'+head+photoPanel(n)+hint+passAll+(contHTML?'<div class="list">'+contHTML+'</div>':'')+(itemHTML?'<div class="list">'+itemHTML+'</div>':'')+empty+add+'</div>'+nav;
}
function addCompView(){

    '<div class="row"><label class="field" style="max-width:120px"><span class="lbl">Code</span><input id="ccode" class="inp" maxlength="5" placeholder="D1"></label><label class="field"><span class="lbl">Name</span><input id="cname" class="inp" placeholder="e.g. Oxygen compartment"></label></div>'+

function moveView(){
  const n=node(V.moveId); if(!n) return truckView();
  const bad=new Set([n.id].concat(descendants(n.id).map(d=>d.id)));
  const T=trucks();
  let body;
  if(n.kind==='comp'){
    body=T.map(t=>'<button class="dest" data-act="moveto" data-t="'+esc(t.id)+'" '+(t.id===n.truck?'disabled':'')+'>'+ico('move')+'<span>'+esc(t.name)+(t.id===n.truck?' <small>(here now)</small>':'')+'</span></button>').join('');
  } else {
    body=T.map(t=>{ const rows=[]; const walk=(p,depth)=>allNodes().filter(x=>x.truck===t.id&&(x.parent||'')===p&&x.kind!=='item').sort((a,b)=>(LOC_RANK[a.loc]||0)-(LOC_RANK[b.loc]||0)||(a.order||0)-(b.order||0)).forEach(x=>{ const dis=bad.has(x.id)||x.id===n.parent;
        rows.push('<button class="dest" style="margin-left:'+depth*18+'px;width:calc(100% - '+depth*18+'px)" data-act="moveto" data-p="'+esc(x.id)+'" '+(dis?'disabled':'')+'>'+kindIcon(x)+'<span>'+esc((x.code?x.code+' · ':'')+x.name)+(x.id===n.parent?' <small>(here now)</small>':'')+'</span></button>'); if(!bad.has(x.id)) walk(x.id,depth+1); }); walk('',0);
      return '<div class="lbl" style="margin:14px 0 6px">'+esc(t.name)+'</div><div class="list">'+rows.join('')+'</div>'; }).join('');
  }
  return topbar('Move '+n.name,'Cancel')+'<p class="muted" style="margin:0 0 10px">Pick where '+esc(n.name)+(n.kind==='item'?'':' and everything in it')+' goes now.</p>'+body;
}
function manageView(){

    return '<div class="trow"><div class="tp">'+(ph?'<img src="'+esc(legacyThumb(ph))+'" alt="">':truckArt(t.name))+'</div><div class="tf"><input class="inp" data-chg="tname" data-t="'+t.id+'" value="'+esc(t.name)+'" aria-label="Truck name">'+
      '<div class="ta"><button class="btn small" data-act="photo" data-k="truck:'+t.id+'">'+ico('cam')+(ph?' New photo':' Add photo')+'</button><button class="iconbtn" data-act="tmove" data-d="-1" data-t="'+t.id+'" '+(i===0?'disabled':'')+' aria-label="Move up">↑</button><button class="iconbtn" data-act="tmove" data-d="1" data-t="'+t.id+'" '+(i===T.length-1?'disabled':'')+' aria-label="Move down">↓</button>'+
      '<button class="btn small danger" data-act="tdel" data-t="'+t.id+'">'+(V.arm==='t'+t.id?'Tap again to delete':'Delete')+'</button></div></div></div>'; }).join('');

function render(){
  if(!loaded||drag) return;
  const ae=document.activeElement, fid=ae&&ae.id; let ss=null,se=null; try{ ss=ae.selectionStart; se=ae.selectionEnd; }catch(e){}
  const keep={}; ['crew','miles','newname','newpar','newtype','tnew','ccode','cname','cloc','spname'].forEach(id=>{ const el=document.getElementById(id); if(el) keep[id]=el.value; });
  const od=[...document.querySelectorAll('details[id][open]')].map(d=>d.id);
  const html= V.screen==='truck'?truckView(): V.screen==='node'?nodeView(): V.screen==='addcomp'?addCompView(): V.screen==='move'?moveView(): V.screen==='trucks'?manageView(): homeView();
  document.getElementById('app').innerHTML=html;
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  od.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
  if(V.hl){ const el=document.getElementById('it-'+V.hl); V.hl=null; if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } }
}

/* ---------- actions ---------- */
function setCur(tid,cur){ persist('current/'+tid,cur); }
function openNode(id){ const n=node(id); if(!n) return; if(n.kind==='item'&&n.parent){ Object.assign(V,{screen:'node',nid:n.parent,tid:n.truck,edit:false,arm:null,spotSel:null,hl:n.id}); render(); return; } Object.assign(V,{screen:'node',nid:id,tid:n.truck,edit:false,arm:null,spotSel:null}); render(); window.scrollTo(0,0); }
function deleteNode(id){ const n=node(id); if(!n) return; const all=[n].concat(descendants(id)); const ops=all.map(x=>{ if(x.photo) dropPhoto(x.photo.file); return ['nodes/'+x.id,null]; });
  if(n.parent){ const p=node(n.parent); if(p&&(p.spots||[]).some(s=>s.node===id)){ p.spots=p.spots.map(s=>s.node===id?Object.assign({},s,{node:''}):s); const o=clone(p); delete o.id; ops.push(['nodes/'+p.id,o]); } }
  persistMany(ops); }
const A={
  truck:b=>{ go('truck',{tid:b.dataset.t,q:'',tab:'truck'}); return false; },
  manage:()=>{ go('trucks'); return false; },
  back:()=>{ const s=V.screen; if(s==='node'){ const n=node(V.nid); if(n&&n.parent) openNode(n.parent); else go('truck',{tid:n?n.truck:V.tid}); } else if(s==='move'){ V.moveId=null; V.screen=V.moveFrom||'truck'; render(); } else if(s==='addcomp') go('truck'); else go('home',{q:''}); return false; },
  open:b=>{ openNode(b.dataset.n); return false; },
  tab:b=>{ V.tab=b.dataset.v; V.finishArm=false; },
  clearq:()=>{ V.q=''; render(); const el=document.getElementById('q'); if(el) el.focus(); return false; },
  edit:()=>{ V.edit=!V.edit; V.arm=null; V.spotSel=null; },
  addcomp:()=>{ go('addcomp'); return false; },
  savecomp:()=>{ const name=document.getElementById('cname').value.trim(); const code=document.getElementById('ccode').value.trim().toUpperCase().slice(0,5); const loc=document.getElementById('cloc').value;
    if(!name){ toast('Give the compartment a name.'); return false; }
    const id='n'+uid(); persist('nodes/'+id,{truck:V.tid,parent:'',kind:'comp',name,code,loc,order:Math.max(0,...topComps(V.tid).filter(c=>c.loc===loc).map(c=>c.order||0))+1});
    Object.assign(V,{screen:'node',nid:id,edit:true}); render(); window.scrollTo(0,0); toast(name+' added. Add a photo and what\'s inside.'); return false; },
  addkind:b=>{ V.addKind=b.dataset.v; },
  addchild:()=>{ const name=document.getElementById('newname').value.trim(); if(!name){ toast('Type a name first.'); return false; } const p=node(V.nid);
    const id='n'+uid(); const base={truck:p.truck,parent:p.id,name,order:nextOrder(p.id,p.truck)};
    if(V.addKind==='Item'){ const type=document.getElementById('newtype').value; Object.assign(base,{kind:'item',type,par:type==='count'?Math.max(0,parseInt(document.getElementById('newpar').value)||0):0,critical:false}); }
    else Object.assign(base,{kind:'bag',label:V.addKind});
    persist('nodes/'+id,base); document.getElementById('newname').value=''; toast(name+' added'); },
  up:b=>{ const n=node(b.dataset.n); const sib=kidsOf(n.parent).filter(k=>(k.kind==='item')===(n.kind==='item')); const i=sib.findIndex(x=>x.id===n.id); if(i<1) return; const t=sib[i-1]; sib[i-1]=sib[i]; sib[i]=t; sib.forEach((x,k)=>{ if(x.order!==k+1){ x.order=k+1; saveNode(x); } }); },
  del:b=>{ const id=b.dataset.n; if(V.arm!=='d'+id){ V.arm='d'+id; return; } V.arm=null; const n=node(id); deleteNode(id); toast(n.name+' deleted'); if(id===V.nid){ if(n.parent) openNode(n.parent); else go('truck',{tid:n.truck}); return false; } },
  move:b=>{ V.moveId=b.dataset.n; V.moveFrom=V.screen; V.screen='move'; render(); window.scrollTo(0,0); return false; },
  moveto:b=>{ const n=node(V.moveId); if(!n) return; const all=[n].concat(descendants(n.id)); const ops=[];
    let newTruck=n.truck, newParent=n.parent;
    if(b.dataset.t){ newTruck=b.dataset.t; newParent=''; } else { const p=node(b.dataset.p); newTruck=p.truck; newParent=p.id; }
    if(n.parent){ const op=node(n.parent); if(op&&(op.spots||[]).some(s=>s.node===n.id)){ op.spots=op.spots.map(s=>s.node===n.id?Object.assign({},s,{node:''}):s); const o=clone(op); delete o.id; ops.push(['nodes/'+op.id,o]); } }
    all.forEach(x=>{ const o=clone(x); delete o.id; o.truck=newTruck; if(x.id===n.id){ o.parent=newParent; o.order=nextOrder(newParent,newTruck); } ops.push(['nodes/'+x.id,o]); });
    persistMany(ops); const dest=newParent?node(newParent):truck(newTruck); toast(n.name+' moved to '+(dest?dest.name:'')); V.moveId=null;
    if(newParent) openNode(newParent); else go('truck',{tid:newTruck}); return false; },
  start:()=>{ const crew=document.getElementById('crew').value.trim(); const miles=document.getElementById('miles').value.trim();
    if(!crew){ toast('Enter crew initials to start.'); document.getElementById('crew').focus(); return false; }
    setCur(V.tid,{started:Date.now(),crew,miles,res:{},have:{},restocked:[]}); toast('Check started. Open a compartment to begin.'); },
  discard:()=>{ if(V.arm!=='discard'){ V.arm='discard'; return; } V.arm=null; setCur(V.tid,null); toast('Check discarded'); },
  finish:()=>{ if(!V.finishArm){ V.finishArm=true; return; }
    const tid=V.tid,t=truck(tid),cur=curOf(tid); const items=truckItems(tid); const s=stats(items,cur); const failed=failedList(tid,cur);
    const rec={truck:tid,truckName:t.name,ts:Date.now(),started:cur.started,crew:cur.crew||'',miles:cur.miles||'',total:s.total,pass:s.pass,notChecked:s.left,failed,restocked:cur.restocked||[]};
    persist('checks/'+tid+'_'+rec.ts,rec); setCur(tid,null); V.finishArm=false;
    if(failed.length){ V.tab='needs'; toast('Check saved. Here is what\'s needed.'); } else { toast('Check saved. '+t.name+' is ready.'); go('home'); return false; } },
  res:b=>{ const n=node(b.dataset.n); const cur=clone(curOf(n.truck)); cur.res=cur.res||{}; cur.have=cur.have||{}; const v=b.dataset.v;
    if(!v||cur.res[n.id]===v){ delete cur.res[n.id]; delete cur.have[n.id]; } else { cur.res[n.id]=v; if(v==='fail'&&n.type==='count'&&cur.have[n.id]==null) cur.have[n.id]=Math.max(0,(+n.par||0)-1); if(v==='pass') delete cur.have[n.id]; }

  have:b=>{ const n=node(b.dataset.n); const cur=clone(curOf(n.truck)); cur.have=cur.have||{}; cur.have[n.id]=Math.max(0,Math.min((+n.par||0),(cur.have[n.id]||0)+(+b.dataset.d))); setCur(n.truck,cur); },
  passall:()=>{ const n=node(V.nid); const cur=clone(curOf(n.truck)); cur.res=cur.res||{}; itemsUnder(n.id).forEach(it=>{ if(!cur.res[it.id]) cur.res[it.id]='pass'; }); setCur(n.truck,cur); },
  restock:b=>{ const n=node(b.dataset.n); const tid=V.tid;
    if(b.dataset.src==='cur'){ const cur=clone(curOf(tid)); const qty=n?needOf(n,cur):1; cur.res[b.dataset.n]='pass'; if(cur.have) delete cur.have[b.dataset.n];
      cur.restocked=(cur.restocked||[]).concat([{node:b.dataset.n,name:n?n.name:'Item',path:pathText(b.dataset.n),qty,t:Date.now(),by:cur.crew||''}]); setCur(tid,cur); toast((n?n.name:'Item')+' restocked'); }
    else { const k=checksOf(tid)[0]; if(!k) return; const rec=clone(k); const id=rec.id; delete rec.id; const f=rec.failed[+b.dataset.i]; f.restocked=true;
      rec.restocked=(rec.restocked||[]).concat([{node:f.node,name:f.name,path:f.path,qty:f.need,t:Date.now(),by:rec.crew||''}]); persist('checks/'+id,rec); toast(f.name+' restocked'); } },
  copyneeds:()=>{ const t=truck(V.tid); const L=needsList(V.tid).filter(x=>!x.done); const txt=[t.name+' needed · '+new Date().toLocaleDateString()].concat(L.map(x=>'- '+x.name+(x.type==='count'?' × '+x.need:' (fix/replace)')+' ['+x.path+']')).join('\n');
    const box=document.getElementById('copybox'); const sel=()=>{ box.hidden=false; box.value=txt; box.select(); toast('Select and copy the list below'); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast('List copied'),sel); }catch(e){ sel(); } return false; },
  photo:b=>{ V.photoKey=b.dataset.k; document.getElementById('photoin').click(); return false; },
  photodel:()=>{ if(V.arm!=='photodel'){ V.arm='photodel'; return; } V.arm=null; const n=node(V.nid); if(n.photo) dropPhoto(n.photo.file); delete n.photo; n.spots=[]; saveNode(n); },
  spotsel:b=>{ V.spotSel=b.dataset.s||null; },
  spotdel:b=>{ const n=node(V.nid); n.spots=(n.spots||[]).filter(x=>x.id!==b.dataset.s); saveNode(n); V.spotSel=null; },
  spotnew:b=>{ const name=document.getElementById('spname').value.trim(); if(!name){ toast('Type a name first.'); return false; } const p=node(V.nid); const id='n'+uid();
    const base={truck:p.truck,parent:p.id,name,order:nextOrder(p.id,p.truck)}; if(V.addKind==='Item') Object.assign(base,{kind:'item',type:'count',par:1,critical:false}); else Object.assign(base,{kind:'bag',label:V.addKind});
    persist('nodes/'+id,base); p.spots=(p.spots||[]).map(s=>s.id===b.dataset.s?Object.assign({},s,{node:id}):s); saveNode(p); V.spotSel=null; toast(name+' added'); },
  tmove:b=>{ const T=trucks(); const i=T.findIndex(t=>t.id===b.dataset.t), j=i+(+b.dataset.d); if(j<0||j>=T.length) return; const x=T[i]; T[i]=T[j]; T[j]=x; T.forEach((t,k)=>{ if(t.order!==k+1){ const o=clone(t); delete o.id; o.order=k+1; persist('trucks/'+t.id,o); } }); },
  tdel:b=>{ const tid=b.dataset.t; if(V.arm!=='t'+tid){ V.arm='t'+tid; return; } V.arm=null; const ops=[['trucks/'+tid,null],['current/'+tid,null]]; allNodes().filter(n=>n.truck===tid).forEach(n=>{ if(n.photo) dropPhoto(n.photo.file); ops.push(['nodes/'+n.id,null]); }); persistMany(ops); toast('Truck deleted'); },
  tadd:()=>{ const name=document.getElementById('tnew').value.trim(); if(!name){ toast('Type a name for the truck.'); return false; } const tid='t'+uid(); const ops=[['trucks/'+tid,{name,order:trucks().length+1}]];

    persistMany(ops); document.getElementById('tnew').value=''; toast(name+' added'); },

const ARMED=['del','discard','tdel','photodel'];
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act; if(!ARMED.includes(act)) V.arm=null; if(act!=='finish'&&act!=='discard') V.finishArm=false;
  const r=A[act]&&A[act](b,e); if(r!==false) render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='crew'){ A.start(); render(); } if(e.key==='Enter'&&e.target.id==='q') e.target.blur(); if(e.key==='Enter'&&e.target.id==='newname'){ A.addchild(); render(); } });
document.addEventListener('input',e=>{ if(e.target.dataset.inp==='q'){ V.q=e.target.value; render(); } });
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.chg; if(!k) return;
  if(k==='tname'){ const tr=truck(t.dataset.t); if(tr){ const o=clone(tr); delete o.id; o.name=t.value.trim()||tr.name; persist('trucks/'+tr.id,o); } render(); return; }
  if(k==='spotnode'){ const n=node(V.nid); n.spots=(n.spots||[]).map(s=>s.id===t.dataset.s?Object.assign({},s,{node:t.value}):s); saveNode(n); if(t.value) V.spotSel=null; render(); return; }
  const n=node(t.dataset.n); if(!n) return;
  if(k==='name') n.name=t.value.trim()||n.name;
  if(k==='code') n.code=t.value.trim().toUpperCase().slice(0,5);
  if(k==='loc'){ n.loc=t.value; n.order=Math.max(0,...topComps(n.truck).filter(c=>c.loc===t.value&&c.id!==n.id).map(c=>c.order||0))+1; }
  if(k==='label') n.label=t.value;
  if(k==='type'){ n.type=t.value; if(n.type==='check') n.par=0; else if(!n.par) n.par=1; }
  if(k==='par') n.par=Math.max(0,parseInt(t.value)||0);
  if(k==='crit') n.critical=t.checked;
  saveNode(n); render();
});
document.getElementById('photoin').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; const key=V.photoKey; if(!f||!key) return;
  toast('Saving photo…');
  try{
    if(key.startsWith('truck:')){ const im=await loadImg(f); let thumb=shrink(im,480).toDataURL('image/jpeg',.7); if(thumb.length>40000) thumb=shrink(im,360).toDataURL('image/jpeg',.6);
      photosFor(key).forEach(p=>{ persist('photos/'+p.id,null); if(p.file) call('deletePhoto',p.file).catch(()=>{}); }); persist('photos/p'+uid(),{comp:key,thumb,t:Date.now()}); render(); toast('Photo saved'); return; }
    const n=node(key.slice(5)); if(!n) return; const ph=await savePhoto(f); const fresh=node(n.id); if(fresh.photo) dropPhoto(fresh.photo.file); fresh.photo=ph; if(!fresh.spots) fresh.spots=[]; saveNode(fresh);
    if(fresh.kind!=='item'&&V.nid===fresh.id){ V.edit=true; toast('Photo saved. Drag on it to draw boxes.'); } else toast('Photo saved'); render();
  }catch(err){ toast(online?'Photo didn\'t save. Try again.':'You need a signal to save photos.'); }
});

/* ---------- drawing boxes ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{ const pv=e.target.closest('#pv.editing'); if(!pv||e.target.closest('.spot')) return; e.preventDefault(); const rc=pv.getBoundingClientRect(); const el=document.createElement('div'); el.id='draw'; pv.appendChild(el);
  drag={pv,rc,el,x0:(e.clientX-rc.left)/rc.width,y0:(e.clientY-rc.top)/rc.height,x1:null,y1:null}; try{ pv.setPointerCapture(e.pointerId); }catch(err){} });
document.addEventListener('pointermove',e=>{ if(!drag) return; e.preventDefault(); const c=n=>Math.max(0,Math.min(1,n)); drag.x1=c((e.clientX-drag.rc.left)/drag.rc.width); drag.y1=c((e.clientY-drag.rc.top)/drag.rc.height);
  Object.assign(drag.el.style,{left:Math.min(drag.x0,drag.x1)*100+'%',top:Math.min(drag.y0,drag.y1)*100+'%',width:Math.abs(drag.x1-drag.x0)*100+'%',height:Math.abs(drag.y1-drag.y0)*100+'%'}); });
document.addEventListener('pointerup',()=>{ if(!drag) return; const d=drag; drag=null; if(d.x1==null){ d.el.remove(); return; }
  const r1=n=>Math.round(n*1000)/10; const x=Math.min(d.x0,d.x1),y=Math.min(d.y0,d.y1),w=Math.abs(d.x1-d.x0),h=Math.abs(d.y1-d.y0);
  if(w<0.03||h<0.03){ d.el.remove(); toast('Drag a little farther to make a box.'); return; }
  const n=node(d.pv.dataset.n); if(!n){ d.el.remove(); return; } const id='s'+uid(); n.spots=(n.spots||[]).concat([{id,node:'',x:r1(x),y:r1(y),w:r1(w),h:r1(h)}]); saveNode(n); V.spotSel=id; render();
  const panel=document.querySelector('.spotpanel'); if(panel) panel.scrollIntoView({block:'nearest',behavior:'smooth'}); });
document.addEventListener('pointercancel',()=>{ if(drag){ drag.el.remove(); drag=null; } });

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; render(); });
window.addEventListener('online',()=>{ flush(); pull(); });
if(!GAS&&!LOCAL&&'serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
if(loaded) render();
pull();
setInterval(()=>{ if(document.visibilityState==='visible') pull(); },15000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
</script>
</body></html>
